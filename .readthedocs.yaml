---
version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    post_install:
      - pip install uv
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv pip install \
        -e ./python \
        mkdocs-material \
        "mkdocstrings[python]" \
        mkdoxy

mkdocs:
  configuration: mkdocs.yml
