---
version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    post_install:
      - pip install uv
      - |
        VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH \
        CXX=clang++-18 \
        CMAKE_ARGS="-DTGN_BUILD_PYTHON=ON" \
        uv pip install mkdocs-material "mkdocstrings[python]" mkdoxy \
        uv pip install -e ./python

mkdocs:
  configuration: mkdocs.yml
