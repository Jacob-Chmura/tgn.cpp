---
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libomp-18-dev

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build TGN
        run: make build BUILD_TYPE=${{ matrix.build_type }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Download Debug Build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-Debug
          path: build/

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Run Tests
        run: make test

  cpp-lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Debug Build
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-latest-Debug
          path: build/

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          database: "build"
          style: "file" # Use .clang-format config file
          tidy-checks: "" # Use .clang-tidy config file

  test-on-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build TGN Container
        run: docker build -t tgn-dev .

      - name: Run Tests inside Container
        run: |
          docker run --rm \
          -v "$(pwd):/workspace:Z" \
            tgn-dev /bin/bash -c "make test"

  python-tests:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-Release
          path: build/

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Clang Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libomp-18-dev

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install & Test Python Bindings
        run: make test-python

  python-tests-on-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python Suite in Container
        run: |
          docker build -t tgn-dev .
          docker run --rm \
            -v "$(pwd):/workspace:Z" \
            tgn-dev /bin/bash -c "make test-python"
