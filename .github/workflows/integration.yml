---
name: Integration Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-all:
    name: Build (${{ matrix.os }}, CUDA=${{ matrix.cuda_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        cuda_version: [cpu] # Cuda builds are tested on our containers

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libomp-18-dev

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Build TGN Examples
        run: make examples BUILD_TYPE=Release CUDA_VERSION=${{ matrix.cuda_version }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.cuda_version }}-Release
          path: build/

  link-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest, macos-latest]
        dataset: [tgbl-wiki] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-cpu-Release
          path: build/

      - name: Restore Binary Permissions
        run: |
          chmod +x build/examples/tgn_link_pred

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Run Link Prediction
        run: make run-link-${{ matrix.dataset }}

  node-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest, macos-latest]
        dataset: [tgbn-trade] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-cpu-Release
          path: build/

      - name: Restore Binary Permissions
        run: |
          chmod +x build/examples/tgn_node_pred

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install OpenMP (MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Run Node Prediction
        run: make run-node-${{ matrix.dataset }}

  node-pred-on-container:
    name: Container Integration (CUDA=${{ matrix.cuda_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda_version: [cpu, 12.6, 12.8, 13.0]
    steps:
      - uses: actions/checkout@v4

      - name: Build TGN Container
        run: docker build --build-arg CUDA_VERSION=${{ matrix.cuda_version }} -t tgn-dev:${{ matrix.cuda_version }} .

      - name: Run Node Prediction
        run: |
          # If CPU: run full node prediction. If CUDA: just verify 'make examples' compiles.
          CMD=$([[ "${{ matrix.cuda_version }}" == "cpu" ]] && echo "make run-node-tgbn-trade" || echo "make examples")
          docker run --rm -v "$(pwd):/workspace:Z" tgn-dev /bin/bash -c "$CMD"
