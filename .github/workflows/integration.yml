---
name: Integration Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev uv

      - name: Build TGN (Tools + Examples)
        run: make tools examples BUILD_TYPE=Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgn-release-build
          path: build/

  link-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
        dataset: [tgbl-wiki] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tgn-release-build
          path: build/

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Link Prediction
        run: make run-link-${{ matrix.dataset }}

  node-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
        dataset: [tgbn-trade] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tgn-release-build
          path: build/

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Node Prediction
        run: make run-node-${{ matrix.dataset }}
