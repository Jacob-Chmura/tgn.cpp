---
name: Integration Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Build TGN (Tools + Examples)
        run: make tools examples BUILD_TYPE=Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgn-release-build
          path: build/

  link-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
        dataset: [tgbl-wiki] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tgn-release-build
          path: build/

      - name: Restore Binary Permissions
        run: |
          chmod +x build/tools/tguf_cli/tguf_cli
          chmod +x build/examples/tgn_link_pred

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Link Prediction
        run: make run-link-${{ matrix.dataset }}

  node-pred:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
        dataset: [tgbn-trade] # TODO(kuba): Consider some larger ones too
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tgn-release-build
          path: build/

      - name: Restore Binary Permissions
        run: |
          chmod +x build/tools/tguf_cli/tguf_cli
          chmod +x build/examples/tgn_node_pred

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Node Prediction
        run: make run-node-${{ matrix.dataset }}

  custom-csv-to-tguf-smoke-test:
    needs: build-all
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testing across Linux and macOS
        os: [ubuntu-latest] # TODO(kuba): Get LibTorch to link with macOS
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tgn-release-build
          path: build/

      - name: Restore Binary Permissions
        run: |
          chmod +x build/tools/tguf_cli/tguf_cli
          chmod +x build/examples/tgn_node_pred

      - name: Generate Dummy CSVs
        run: |
          mkdir -p data
          # Edges: 3 rows, 2 msgs, 0 negs
          cat <<EOF > data/dummy_edges.csv
          src,dst,time,msg_0,msg_1
          1,2,100.0,0.1,0.2
          2,3,101.0,0.3,0.4
          3,1,102.0,0.5,0.6
          EOF

          # Labels: 2 rows, 2 node_y labels
          cat <<EOF > data/dummy_labels.csv
          node_id,time,node_y0,node_y1
          1,105.0,1,0
          2,106.0,0,1
          EOF

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Convert CSV to TGUF
        run: uv run python tools/convert_csv_to_tguf.py \
          --edges data/dummy_edges.csv \
          --labels data/dummy_labels.csv \
          --output data/dummy.tguf \
          --batch_size 2

      - name: Run Node Prediction
        # TODO(kuba): Would be nice to have a script for testing binary directly
        # Here we just run node prop and ensure the tguf file can be read as a store
        run: ./build/examples/tgn_node_pred data/dummy.tguf
